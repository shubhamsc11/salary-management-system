services:
  - type: web
    name: salary-management-api
    runtime: ruby
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: salary-management-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_HOST
        sync: false
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"

databases:
  - name: salary-management-db
